name: CI

# Lightweight PR validation that gates Renovate patch automerge.
# Catches regressions in dependency updates that touch:
#   - docker-compose.yml (image digest bumps, env interpolation)
#   - shell scripts (install.sh, runner-entrypoint.sh, mint-runner-token.sh,
#     iptables-rules.sh)
#
# The full hardware-in-the-loop test lives in test-runner.yml (workflow_dispatch
# only); this CI keeps PR feedback fast and unblocks Renovate auto-merges.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck (error severity)
        run: |
          shellcheck --severity=error \
            install.sh \
            runner-entrypoint.sh \
            mint-runner-token.sh \
            iptables-rules.sh

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stub .env (compose interpolation requires ROKU_DEVICE_IP)
        run: |
          # RFC 5737 documentation IP; never resolves to a real host
          echo 'ROKU_DEVICE_IP=192.0.2.1' > .env
      - name: docker compose config
        run: docker compose --env-file .env -f docker-compose.yml config --quiet

  install-script-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash -n install.sh
        run: bash -n install.sh
      - name: install.sh --help exits 0
        run: bash install.sh --help

  # Actually pull and exercise the pinned runner image. Renovate can no longer
  # soak myoung34/github-runner digests (upstream rebuilds :latest faster than
  # the soak window, so the clock resets forever — see renovate.json). With the
  # soak dropped, THIS job is the real gate on digest automerge: a broken or
  # GitHub-deprecated runner binary would pass `docker compose config` (YAML
  # only) but fail here. ~1GB pull, runs concurrently with the other jobs.
  runner-image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Runner binary is present and self-reports a version
        run: |
          IMG=$(grep -oP 'myoung34/github-runner@sha256:[a-f0-9]+' docker-compose.yml)
          echo "Testing $IMG"
          docker pull "$IMG"
          # config.sh refuses to run as root, so exercise the listener directly.
          # A semver version proves the runner binary loaded and isn't a broken
          # image — the deprecation-relevant signal a digest rebuild can break.
          VERSION=$(docker run --rm \
            --entrypoint /actions-runner/bin/Runner.Listener "$IMG" --version)
          echo "Runner version: $VERSION"
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'
